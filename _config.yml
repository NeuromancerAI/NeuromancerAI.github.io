remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache  # <--- ADD THIS LINE
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
title: "DIMO ILIEV, Senior Technical Product Manager"
